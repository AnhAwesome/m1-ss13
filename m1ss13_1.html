<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let danhSachSo = [];

        while (danhSachSo.length < 10) {

            let soNgauNhien = Math.floor(Math.random() * 100) + 1;

            if (Math.random() < 0.5) {

                danhSachSo.push(soNgauNhien);
            } else {

                danhSachSo.unshift(soNgauNhien);
            }
        }

        console.log("MẢNG 10 PHẦN TỬ NGẪU NHIÊN");
        console.log(danhSachSo);

    </script>
</body>

</html>
