<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        
        let mangCoSan = [8, 11, 4, 98, 99, 23];

        let soNhapVao = parseInt(prompt("Nhập vào một số bất kỳ để thử vận may:"));

        if (mangCoSan.includes(soNhapVao)) {
            alert("Bingo");
        } else {
            alert("Chúc bạn may mắn lần sau");
        }

        console.log("Mảng số có sẵn:", mangCoSan);

    </script>
</body>

</html>
